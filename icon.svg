<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="GOLDEN-EYE 源巡检监控">
  <defs>
    <linearGradient id="ge-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2233"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="ge-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc4d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffcc4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="256" height="256" rx="56" fill="url(#ge-bg)"/>
  <circle cx="128" cy="128" r="104" fill="url(#ge-glow)"/>

  <!-- 雷达同心圆 -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#f5c451" stroke-opacity="0.20" stroke-width="6"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="#f5c451" stroke-opacity="0.32" stroke-width="6"/>

  <!-- 雷达扫描扇形 -->
  <path d="M128 128 L128 40 A88 88 0 0 1 190 66 Z" fill="#f5c451" fill-opacity="0.18"/>

  <!-- 眼睛外形（金色描边） -->
  <path d="M40 128 C72 84 184 84 216 128 C184 172 72 172 40 128 Z"
        fill="#0f1622" stroke="#f5c451" stroke-width="10" stroke-linejoin="round"/>

  <!-- 瞳孔 -->
  <circle cx="128" cy="128" r="30" fill="#f5c451"/>
  <circle cx="128" cy="128" r="13" fill="#0f1622"/>

  <!-- 瞳孔高光 -->
  <circle cx="140" cy="117" r="6" fill="#ffffff" fill-opacity="0.85"/>
</svg>
